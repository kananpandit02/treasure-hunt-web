<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treasure Hunt — QR Video Scanner</title>

  <style>
    html, body, #root { height: 100%; margin: 0; font-family: system-ui; }
    .app { min-height: 100%; padding: 20px; background: #f3f4f6; display: flex; flex-direction: column; align-items: center; }
    .card { width: 100%; max-width: 460px; background: white; padding: 16px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.1); margin-top: 18px; }
    .btn { width: 100%; padding: 12px; border-radius: 10px; border: 0; font-weight: 700; margin-top: 10px; cursor: pointer; }
    .btn-blue { background: #2563eb; color: white; }
    .btn-green { background: #059669; color: white; }
    .btn-yellow { background: #d97706; color: white; }
    .btn-red { background: #dc2626; color: white; }
    video { width: 100%; border-radius: 10px; background: black; margin-top: 10px; }
    .muted { font-size: 14px; color: #6b7280; }
  </style>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STORAGE_KEY = "treasure_clues_final";

    function loadClues() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
      catch { return []; }
    }

    function saveClues(clues) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(clues));
    }

    function App() {
      const [screen, setScreen] = useState("home");
      const [clues, setClues] = useState(loadClues());
      const [selected, setSelected] = useState(null);

      const [cameras, setCameras] = useState([]);
      const [camId, setCamId] = useState(null);

      const scannerRef = useRef(null);
      const videoRef = useRef(null);

      useEffect(() => saveClues(clues), [clues]);

      // Start Camera Scanner
      async function startScanner() {
        setScreen("scanner");

        setTimeout(async () => {
          try {
            const devices = await Html5Qrcode.getCameras();
            setCameras(devices);

            const backCam =
              devices.find(c => /back|rear|environment/i.test(c.label)) || devices[0];

            setCamId(backCam.id);

            scannerRef.current = new Html5Qrcode("qr-box");

            await scannerRef.current.start(
              backCam.id,
              { fps: 10, qrbox: { width: 250, height: 250 } },
              (decoded) => {
                stopScanner();
                handleScan(decoded);
              }
            );
          } catch (e) {
            alert("Camera failed: " + e);
          }
        }, 400);
      }

      async function switchCamera(id) {
        if (!scannerRef.current) return;

        await scannerRef.current.stop();
        await scannerRef.current.start(
          id,
          { fps: 10, qrbox: { width: 250, height: 250 } },
          (decoded) => {
            stopScanner();
            handleScan(decoded);
          }
        );
        setCamId(id);
      }

      function stopScanner() {
        if (scannerRef.current) {
          scannerRef.current.stop().then(() => {
            scannerRef.current.clear();
            scannerRef.current = null;
          });
        }
      }

      // Handle QR Scan
      function handleScan(text) {
        let d = null;
        try { d = JSON.parse(text); } catch {}

        let clue;

        if (d && d.type === "video") {
          clue = {
            id: Date.now(),
            url: d.url,
            transcript: d.transcript || "No transcript",
            digit: d.digit ?? null,
          };
        } else if (text.startsWith("http")) {
          clue = {
            id: Date.now(),
            url: text,
            transcript: "Scanned video",
            digit: null,
          };
        } else {
          alert("Invalid QR: must contain a video URL.");
          return;
        }

        setClues([clue, ...clues]);
        setSelected(clue);
        setScreen("startvideo"); // OPTION B SCREEN
      }

      // Demo
      function playDemo() {
        const clue = {
          id: Date.now(),
          url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
          transcript: "Demo video",
          digit: null,
        };
        setClues([clue, ...clues]);
        setSelected(clue);
        setScreen("startvideo");
      }

      // Start video with SOUND
      function startVideoWithSound() {
        setScreen("video");
        setTimeout(() => {
          if (videoRef.current)
            videoRef.current.play().catch(() => {});
        }, 300);
      }

      return (
        <div className="app">

          {/* HOME */}
          {screen === "home" && (
            <div className="card">
              <h2>Treasure Hunt</h2>
              <button className="btn btn-blue" onClick={startScanner}>Open Camera Scanner</button>
              <button className="btn btn-green" onClick={() => setScreen("list")}>Past Clues</button>
              <button className="btn btn-yellow" onClick={playDemo}>Play Demo</button>
            </div>
          )}

          {/* SCANNER */}
          {screen === "scanner" && (
            <div className="card">
              <h3>Scan QR Code</h3>

              {cameras.length > 0 && (
                <select value={camId} onChange={(e) => switchCamera(e.target.value)}>
                  {cameras.map(c => (
                    <option key={c.id} value={c.id}>{c.label}</option>
                  ))}
                </select>
              )}

              <div
                id="qr-box"
                style={{
                  width: "100%",
                  height: "300px",
                  background: "black",
                  borderRadius: "10px",
                  marginTop: "10px"
                }}
              ></div>

              <button className="btn btn-red"
                onClick={() => { stopScanner(); setScreen("home"); }}>
                Close
              </button>
            </div>
          )}

          {/* TAP-TO-START VIDEO */}
          {screen === "startvideo" && selected && (
            <div className="card">
              <h3>Ready?</h3>
              <p className="muted">{selected.transcript}</p>

              <button className="btn btn-blue" onClick={startVideoWithSound}>
                ▶ Start Video with Sound
              </button>

              <button className="btn btn-red" onClick={() => setScreen("home")}>
                Home
              </button>
            </div>
          )}

          {/* VIDEO PLAYER */}
          {screen === "video" && selected && (
            <div className="card">
              <h3>Clue Video</h3>

              <video ref={videoRef} controls playsInline>
                <source src={selected.url} type="video/mp4" />
              </video>

              <button className="btn btn-yellow" onClick={() => setScreen("list")}>Skip / Continue</button>
              <button className="btn btn-green" onClick={() => setScreen("list")}>Back to Clues</button>
              <button className="btn btn-red" onClick={() => setScreen("home")}>Home</button>
            </div>
          )}

          {/* LIST */}
          {screen === "list" && (
            <div className="card">
              <h3>Past Clues</h3>

              {clues.map(c => (
                <button key={c.id} className="btn" style={{ background:"#f8fafc" }}
                  onClick={() => { setSelected(c); setScreen("startvideo"); }}>
                  🎥 {c.transcript}
                </button>
              ))}

              <button className="btn btn-red" onClick={() => setScreen("home")}>Close</button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
