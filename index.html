<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treasure Hunt — QR Video Scanner</title>

  <style>
    html, body, #root { height: 100%; margin: 0; font-family: system-ui; }
    .app { min-height: 100%; padding: 20px; background: #f3f4f6; display: flex; flex-direction: column; align-items: center; }
    .card { width: 100%; max-width: 460px; background: white; padding: 16px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.1); margin-top: 18px; }
    .btn { width: 100%; padding: 12px; border-radius: 10px; border: 0; font-weight: 700; margin-top: 10px; cursor: pointer; }
    .btn-blue { background: #2563eb; color: white; }
    .btn-green { background: #059669; color: white; }
    .btn-yellow { background: #d97706; color: white; }
    .btn-red { background: #dc2626; color: white; }
    video { width: 100%; border-radius: 10px; background: black; margin-top: 10px; }
    .muted { font-size: 14px; color: #6b7280; }
  </style>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STORAGE_KEY = "treasure_hunt_clues_sound";

    function loadClues() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
      catch { return []; }
    }
    function saveClues(list) { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }

    function App() {
      const [screen, setScreen] = useState("home");
      const [clues, setClues] = useState(loadClues());
      const [selected, setSelected] = useState(null);

      const [cameras, setCameras] = useState([]);
      const [camId, setCamId] = useState(null);

      const scanner = useRef(null);
      const videoRef = useRef(null);

      useEffect(() => saveClues(clues), [clues]);

      // Start Camera
      async function startScanner() {
        setScreen("scanner");

        setTimeout(async () => {
          try {
            const camList = await Html5Qrcode.getCameras();
            setCameras(camList);
            const backCam =
              camList.find(c => /back|rear|environment/i.test(c.label)) || camList[0];
            setCamId(backCam.id);

            scanner.current = new Html5Qrcode("qr-box");

            await scanner.current.start(
              backCam.id,
              { fps: 10, qrbox: { width: 250, height: 250 } },
              (text) => {
                stopScanner();
                onScan(text);
              }
            );
          } catch (err) {
            alert("Camera Error: " + err);
          }
        }, 300);
      }

      async function switchCamera(id) {
        if (!scanner.current) return;

        await scanner.current.stop();
        await scanner.current.start(
          id,
          { fps: 10, qrbox: { width: 250, height: 250 } },
          (text) => {
            stopScanner();
            onScan(text);
          }
        );
        setCamId(id);
      }

      function stopScanner() {
        if (scanner.current) {
          scanner.current.stop().then(() => {
            scanner.current.clear();
            scanner.current = null;
          });
        }
      }

      // QR Decoded
      function onScan(text) {
        let json = null;
        try { json = JSON.parse(text); } catch {}

        let clue;

        if (json && json.type === "video") {
          clue = {
            id: Date.now(),
            url: json.url,
            transcript: json.transcript || "No transcript",
            digit: json.digit ?? null
          };
        } else if (text.startsWith("http")) {
          clue = {
            id: Date.now(),
            url: text,
            transcript: "Scanned video",
            digit: null
          };
        } else {
          alert("Invalid QR format.");
          return;
        }

        setClues([clue, ...clues]);
        setSelected(clue);
        setScreen("startvideo"); // <-- Go to tap-to-start screen
      }

      // DEMO VIDEO
      function playDemo() {
        const clue = {
          id: Date.now(),
          url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
          transcript: "Demo video",
          digit: null
        };
        setClues([clue, ...clues]);
        setSelected(clue);
        setScreen("startvideo");
      }

      // Start video WITH SOUND (Option B)
      function startVideoWithSound() {
        setScreen("video");
        setTimeout(() => {
          if (videoRef.current) {
            videoRef.current.play().catch(() => {});
          }
        }, 200);
      }

      return (
        <div className="app">

          {/* HOME */}
          {screen === "home" && (
            <div className="card">
              <h2>Treasure Hunt</h2>

              <button className="btn btn-blue" onClick={startScanner}>
                Open Camera Scanner
              </button>

              <button className="btn btn-green" onClick={() => setScreen("list")}>
                Past Clues
              </button>

              <button className="btn btn-yellow" onClick={playDemo}>
                Play Demo
              </button>
            </div>
          )}

          {/* SCANNER */}
          {screen === "scanner" && (
            <div className="card">
              <h3>Scan QR Code</h3>

              {cameras.length > 0 && (
                <select value={camId} onChange={(e) => switchCamera(e.target.value)}>
                  {cameras.map(cam => (
                    <option key={cam.id} value={cam.id}>{cam.label}</option>
                  ))}
                </select>
              )}

              <div id="qr-box"
                   style="width:100%;height:300px;background:black;border-radius:10px;margin-top:10px">
              </div>

              <button className="btn btn-red" onClick={() => { stopScanner(); setScreen("home"); }}>
                Close
              </button>
            </div>
          )}

          {/* START VIDEO SCREEN (Option B) */}
          {screen === "startvideo" && selected && (
            <div className="card">
              <h3>Ready to Play</h3>
              <p className="muted">{selected.transcript}</p>

              <button className="btn btn-blue" onClick={startVideoWithSound}>
                ▶ Start Video with Sound
              </button>

              <button className="btn btn-red" onClick={() => setScreen("home")}>
                Home
              </button>
            </div>
          )}

          {/* VIDEO PLAYER */}
          {screen === "video" && selected && (
            <div className="card">
              <h3>Clue Video</h3>

              <video ref={videoRef} controls playsinline>
                <source src={selected.url} type="video/mp4" />
              </video>

              <button className="btn btn-yellow" onClick={() => setScreen("list")}>
                Skip / Continue
              </button>

              <button className="btn btn-green" onClick={() => setScreen("list")}>
                Back to Clues
              </button>

              <button className="btn btn-red" onClick={() => setScreen("home")}>
                Home
              </button>
            </div>
          )}

          {/* PAST CLUES */}
          {screen === "list" && (
            <div className="card">
              <h3>Past Clues</h3>

              {clues.map(c => (
                <button key={c.id} className="btn" style={{background:"#f8fafc"}}
                  onClick={() => { setSelected(c); setScreen("startvideo"); }}>
                  🎥 {c.transcript}
                </button>
              ))}

              <button className="btn btn-red" onClick={() => setScreen("home")}>
                Close
              </button>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
