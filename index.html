<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Treasure Hunt — QR Scanner</title>

    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        font-family: system-ui;
      }
      .app {
        min-height: 100%;
        padding: 20px;
        background: #f3f4f6;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        padding: 16px;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        margin-top: 20px;
      }
      .btn {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border-radius: 10px;
        font-weight: 600;
        border: none;
        cursor: pointer;
      }
      .btn-blue { background: #2563eb; color: white; }
      .btn-green { background: #059669; color: white; }
      .btn-yellow { background: #d97706; color: white; }
      .btn-red { background: #dc2626; color: white; }
      .muted { color: #6b7280; font-size: 14px; }
      video {
        width: 100%;
        border-radius: 12px;
        margin-top: 10px;
        background: black;
      }
    </style>

    <!-- QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- React + Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      function App() {
        const [screen, setScreen] = useState("home");
        const [selectedClue, setSelectedClue] = useState(null);
        const [clues, setClues] = useState(() =>
          JSON.parse(localStorage.getItem("clues") || "[]")
        );
        const qrRef = useRef(null);
        const scanner = useRef(null);

        useEffect(() => {
          localStorage.setItem("clues", JSON.stringify(clues));
        }, [clues]);

        function startScanner() {
          setScreen("scanner");

          setTimeout(() => {
            scanner.current = new Html5Qrcode("qr-box");

            Html5Qrcode.getCameras().then((devices) => {
              if (!devices || devices.length === 0) {
                alert("No camera detected.");
                return;
              }

              const cameraId = devices[0].id;

              scanner.current.start(
                cameraId,
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodeText) => {
                  stopScanner();
                  handleScan(decodeText);
                }
              );
            });
          }, 300);
        }

        function stopScanner() {
          if (scanner.current) {
            scanner.current.stop().then(() => {
              scanner.current.clear();
              scanner.current = null;
            });
          }
        }

        function handleScan(text) {
          let json = null;
          try {
            json = JSON.parse(text);
          } catch {}

          let clue = null;

          if (json && json.type === "video" && json.url) {
            clue = {
              id: Date.now(),
              url: json.url,
              transcript: json.transcript || "No transcript",
              digit: json.digit ?? null
            };
          } else if (text.startsWith("http")) {
            clue = {
              id: Date.now(),
              url: text,
              transcript: "Scanned video",
              digit: null
            };
          } else {
            alert("Invalid QR format.");
            return;
          }

          setClues([clue, ...clues]);
          setSelectedClue(clue);
          setScreen("video");
        }

        function skipDemo() {
          stopScanner();
          const url =
            "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";

          const clue = {
            id: Date.now(),
            url,
            transcript: "Demo Video",
            digit: null
          };

          setClues([clue, ...clues]);
          setSelectedClue(clue);
          setScreen("video");
        }

        return (
          <div className="app">
            {screen === "home" && (
              <div className="card">
                <button className="btn btn-blue" onClick={startScanner}>
                  Open Camera Scanner
                </button>
                <button className="btn btn-green" onClick={() => setScreen("list")}>
                  Past Clues
                </button>
              </div>
            )}

            {screen === "scanner" && (
              <div className="card">
                <h2>Scan QR Code</h2>
                <div
                  id="qr-box"
                  style={{
                    width: "100%",
                    height: "300px",
                    background: "black",
                    borderRadius: "10px"
                  }}
                ></div>

                <button className="btn btn-yellow" onClick={skipDemo}>
                  Skip
                </button>
                <button
                  className="btn btn-red"
                  onClick={() => {
                    stopScanner();
                    setScreen("home");
                  }}
                >
                  Close
                </button>
              </div>
            )}

            {screen === "video" && selectedClue && (
              <div className="card">
                <h2>Video</h2>
                <video controls autoPlay playsInline>
                  <source src={selectedClue.url} type="video/mp4" />
                </video>
                <p className="muted">{selectedClue.transcript}</p>

                <button className="btn btn-green" onClick={() => setScreen("list")}>
                  Back to Clues
                </button>
                <button className="btn btn-red" onClick={() => setScreen("home")}>
                  Home
                </button>
              </div>
            )}

            {screen === "list" && (
              <div className="card">
                <h2>Past Clues</h2>

                {clues.map((c) => (
                  <button
                    key={c.id}
                    className="list-button"
                    onClick={() => {
                      setSelectedClue(c);
                      setScreen("video");
                    }}
                  >
                    🎥 {c.transcript}
                  </button>
                ))}

                <button className="btn btn-red" onClick={() => setScreen("home")}>
                  Close
                </button>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
